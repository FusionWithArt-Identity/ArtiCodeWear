<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Flipping Coin (Responsive + Smooth Toss)</title>
  <style>
    /* Root Variables */
    :root {
      --coin-diam: min(30vw, 180px);
      --coin-depth: calc(var(--coin-diam) * 0.1);
      --jump-height: -35vh; /* default for desktop */
      --text-color: #fff;
      --header-font-size: clamp(1.4rem, 2vw, 2.2rem);
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url("https://www.transparenttextures.com/patterns/green-cup.png");
      background-color: #3a7d44;
      font-family: "Georgia", "Times New Roman", Times, serif;
      perspective: 1200px;
      /* CSS for restricting selection and dragging */
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      
      /* Solution to the scrollbar issue: always show scrollbar */
      overflow-y: scroll;
      
      /* Prevent mobile touch highlight */
      -webkit-tap-highlight-color: transparent;
    }

    /* [Rest of your CSS remains exactly the same] */
    /* ... */
  </style>
</head>
<body>
  <!-- [Your HTML content remains exactly the same] -->
  <!-- ... -->

  <script>
    // This is the original script for the coin flip functionality.
    document.addEventListener("DOMContentLoaded", () => {
      const coin = document.getElementById("coin");
      const scene = document.getElementById("scene");
      
      // Prevents right-click context menu
      window.addEventListener("contextmenu", (e) => {
        e.preventDefault();
      });

      setTimeout(() => {
        document.body.classList.add("loaded");
      }, 100);

      coin.addEventListener("click", () => {
        // Decide the result BEFORE starting the animation
        const result = Math.random() < 0.5 ? "heads" : "tails";
        
        // Remove existing classes to reset the animation
        scene.classList.remove("tossed", "show-back", "result-shown");

        // Add the 'show-back' class immediately if the result is 'tails'
        if (result === "tails") {
          scene.classList.add("show-back");
        } else {
          scene.classList.remove("show-back");
        }

        void scene.offsetWidth; // This is a trick to restart the CSS animation

        // Add the 'tossed' class to start the animation
        scene.classList.add("tossed");
      });

      coin.addEventListener("animationend", () => {
        // Once the animation ends, show the text for the final result
        scene.classList.add("result-shown");
      });
    });
  </script>

  <script>
    // Enhanced protection against dev tools
    (function() {
      const detectDevTools = () => {
        const threshold = 160;
        const widthDifference = window.outerWidth - window.innerWidth > threshold;
        const heightDifference = window.outerHeight - window.innerHeight > threshold;

        if (widthDifference || heightDifference) {
          // Clear the entire document
          document.open();
          document.write('<html><head><title>Access Restricted</title></head><body style="background-color:black;color:white;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:Arial;"><h1>Access Restricted</h1></body></html>');
          document.close();
          
          // Prevent further execution
          window.stop();
        }
      };

      setInterval(detectDevTools, 500);
    })();
  </script>

  <script>
    // Enhanced key blocking
    (function() {
      document.addEventListener('keydown', (e) => {
        // Block all special keys and combinations
        if (e.ctrlKey || e.altKey || e.metaKey || e.shiftKey || e.key.startsWith('F')) {
          e.preventDefault();
          return false;
        }

        // Disable navigation keys
        const blockedKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PrintScreen'];
        if (blockedKeys.includes(e.key)) {
            e.preventDefault();
            return false;
        }
      });
      
      // Block "Add to Home Screen" prompts
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        return false;
      });

      // Block saving the page
      window.addEventListener('beforeunload', function(e) {
        // This will show a warning when trying to leave the page
        e.preventDefault();
        e.returnValue = '';
      });
    })();
  </script>

  <script>
    // Nuclear option - if page is saved, it will load blank
    (function() {
      // Store original HTML
      const originalHTML = document.documentElement.outerHTML;
      
      // Override document.write to prevent restoration
      const originalWrite = document.write;
      document.write = function(content) {
        originalWrite.call(document, '<html><head><title>Access Restricted</title></head><body style="background-color:black;color:white;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:Arial;"><h1>Access Restricted</h1></body></html>');
      };
      
      // If page is reloaded or saved, it will load blank
      window.addEventListener('load', function() {
        if (document.documentElement.outerHTML !== originalHTML) {
          document.open();
          document.write('<html><head><title>Access Restricted</title></head><body style="background-color:black;color:white;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:Arial;"><h1>Access Restricted</h1></body></html>');
          document.close();
        }
      });
    })();
  </script>
</body>
</html>
