<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Flipping Coin (Responsive + Smooth Toss)</title>
  <style>
    /* [Your original CSS remains exactly the same] */
    /* ... */
  </style>
</head>
<body>
  <!-- [Your original HTML content remains exactly the same] -->
  <!-- ... -->

  <script>
    // Original coin flip functionality
    document.addEventListener("DOMContentLoaded", () => {
      const coin = document.getElementById("coin");
      const scene = document.getElementById("scene");
      
      // Prevents right-click context menu
      window.addEventListener("contextmenu", (e) => {
        e.preventDefault();
      });

      setTimeout(() => {
        document.body.classList.add("loaded");
      }, 100);

      coin.addEventListener("click", () => {
        const result = Math.random() < 0.5 ? "heads" : "tails";
        scene.classList.remove("tossed", "show-back", "result-shown");

        if (result === "tails") {
          scene.classList.add("show-back");
        } else {
          scene.classList.remove("show-back");
        }

        void scene.offsetWidth;
        scene.classList.add("tossed");
      });

      coin.addEventListener("animationend", () => {
        scene.classList.add("result-shown");
      });
    });
  </script>

  <script>
    // Modified protection that won't trigger in normal offline use
    (function() {
      // Only activate protections if this is not the initial load
      if (sessionStorage.getItem('initialLoad') === 'true') {
        const detectDevTools = () => {
          // More lenient detection that won't trigger on normal offline use
          const threshold = 200;
          const widthDifference = window.outerWidth - window.innerWidth > threshold;
          const heightDifference = window.outerHeight - window.innerHeight > threshold;
          
          // Additional check for dev tools being open
          const devtools = /./;
          devtools.toString = function() {
            document.open();
            document.write('<html><head><title>Access Restricted</title></head><body style="background-color:black;color:white;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:Arial;"><h1>Access Restricted</h1></body></html>');
            document.close();
            return '';
          };
          
          if (widthDifference || heightDifference) {
            console.log(devtools);
          }
        };

        // Only start checking after a delay to avoid false positives
        setTimeout(() => {
          setInterval(detectDevTools, 1000);
        }, 2000);
      }
      
      // Mark initial load
      sessionStorage.setItem('initialLoad', 'true');
    })();
  </script>

  <script>
    // Protection against saving
    (function() {
      // Store original HTML
      const originalHTML = document.documentElement.outerHTML;
      
      // Only activate if this is a reload (not initial load)
      if (performance.navigation.type === 1 || performance.navigation.type === 255) {
        document.open();
        document.write('<html><head><title>Access Restricted</title></head><body style="background-color:black;color:white;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:Arial;"><h1>Access Restricted</h1></body></html>');
        document.close();
        return;
      }
      
      // Block "Save Page As" functionality
      window.addEventListener('beforeunload', function(e) {
        // This will show a warning when trying to leave the page
        if (sessionStorage.getItem('initialLoad') {
          e.preventDefault();
          e.returnValue = '';
        }
      });
    })();
  </script>
</body>
</html>
